<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKRAI - Text to Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        input {
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }
        button {
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
        #status-area {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 0.75rem;
            background: #0f172a;
            display: none;
        }
        .loading {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SKRAI</h1>
        <p>AI Video Generator</p>
        <form id="gen-form">
            <input type="text" name="topic" placeholder="Enter video topic..." required>
            <button type="submit">Generate Video</button>
        </form>
        <div id="status-area">
            <div id="status-text">Status: Queued</div>
            <div id="download-link" style="margin-top: 1rem; display: none;">
                <a href="#" id="video-url" style="color: #818cf8;" target="_blank">Download Video</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('gen-form');
        const statusArea = document.getElementById('status-area');
        const statusText = document.getElementById('status-text');
        const downloadLink = document.getElementById('download-link');
        const videoUrl = document.getElementById('video-url');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            statusArea.style.display = 'block';
            statusText.innerText = 'Status: Initializing...';
            downloadLink.style.display = 'none';

            const response = await fetch('/generate', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            pollStatus(data.job_id);
        };

        async function pollStatus(jobId) {
            const interval = setInterval(async () => {
                const res = await fetch(`/status/${jobId}`);
                const data = await res.json();
                statusText.innerText = 'Status: ' + data.status;

                if (data.status === 'Completed') {
                    clearInterval(interval);
                    videoUrl.href = data.video_url;
                    downloadLink.style.display = 'block';
                } else if (data.status.startsWith('Error') || data.status.startsWith('Failed')) {
                    clearInterval(interval);
                }
            }, 3000);
        }
    </script>
</body>
</html>
