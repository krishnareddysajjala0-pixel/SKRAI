services:
  - type: web
    name: skrai
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: STT_PROVIDER
        value: whisper
      - key: TTS_PROVIDER
        value: edgetts
      - key: EDGETTS_VOICE
        value: en-AU-WilliamNeural
      - key: VIDEO_ORIENTATION
        value: portrait
      - key: CAPTIONS_ENABLED
        value: 'true'
      - key: CAPTION_FONT_SIZE
        value: '100'
      - key: CAPTION_FONT_COLOR
        value: white
      - key: CAPTION_FONT_FACE
        value: Arial-Bold
      - key: CAPTION_STROKE_WIDTH
        value: '3'
      - key: CAPTION_STROKE_COLOR
        value: black
      - key: CAPTION_POSITION
        value: bottom_center
